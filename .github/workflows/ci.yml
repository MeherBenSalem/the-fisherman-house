# CI for Fisherman's Coast (NightBeam convention; based on Bosses' publisher-checks.yml).
# Builds all 8 jars (1.20.1 Fabric + Forge; 1.21.1, 26.2, 26.3 Fabric + NeoForge) with ./gradlew buildAll,
# runs each workspace's unit tests (part of `build`), checks that every workspace has the same version= and that the
# metadata ranges stay inside their Minecraft line, checks that the generated assets and data match tools/ (the
# datagen job of the old build.yml), and runs the publisher script tests (the same-day guard, and the jar-name
# detection the upload step uses, which used to be validate-publish-meta.yml). It never publishes anything.

name: CI

on:
  push:
    branches: [main]
    paths:
      - "1.20.1/**"
      - "1.21.1/**"
      - "26.2/**"
      - "26.3/**"
      - "tools/**"
      - "scripts/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "releases/**"
      - ".github/scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check publisher syntax
        run: |
          for f in scripts/*.mjs .github/scripts/*.js; do node --check "$f"; done
      - name: Test publisher scripts (same-day guard)
        run: node --test scripts/*.test.mjs
      # Jar name -> loader + Minecraft version, as the upload step reads it (calendar versions such as 26.2 must
      # never fall back to 1.21.1).
      - name: Test jar metadata detection
        run: node .github/scripts/detect-jar-meta.test.js
      - name: Spot-check releases/ jar names
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(releases/*.jar)
          if [ ${#jars[@]} -eq 0 ]; then
            echo 'No releases/*.jar, skipping'
            exit 0
          fi
          for jar in "${jars[@]}"; do
            echo -n "$jar -> "
            node .github/scripts/detect-jar-meta.js "$jar"
          done
      - name: Check the 8 targets, one version and metadata ranges
        run: python3 scripts/check_targets.py workspaces

  datagen:
    # The generated assets and data in every workspace must match tools/ (datagen, structures, textures).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate and compare
        run: |
          pip install nbtlib==2.0.4 Pillow==12.3.0
          python3 tools/gen_textures.py
          python3 tools/structures.py
          python3 tools/datagen.py
          git diff --stat --exit-code

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # 21 stays JAVA_HOME (Gradle for 1.20.1/1.21.1); 17 is the 1.20.1 toolchain; the root build hands 26.x
      # JAVA_HOME_25_X64.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build all 8 jars and run the unit tests
        run: |
          chmod +x gradlew 1.20.1/gradlew 1.21.1/gradlew 26.2/gradlew 26.3/gradlew
          ./gradlew buildAll --no-daemon
      - name: Check the 8 jars
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 scripts/check_targets.py version)"
          # releases/ also keeps the jars of earlier releases (history, including the dropped 26.1.2 builds), so
          # check what this build produced in <workspace>/<loader>/build/libs.
          mkdir -p built-jars ci-jars
          cp -f */*/build/libs/fisherman_house-*-"$version".jar built-jars/
          python3 scripts/check_targets.py jars --version "$version" --dir built-jars --list-file ci-jars.txt
          xargs -a ci-jars.txt cp -f -t ci-jars/
          # The upload step must be able to read loader + Minecraft version from every built jar name.
          while IFS= read -r jar; do node .github/scripts/detect-jar-meta.js "$jar"; done < ci-jars.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fisherman_house-jars
          path: ci-jars/*.jar
          if-no-files-found: error
