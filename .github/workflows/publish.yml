# Publish Fisherman's Coast to Modrinth + CurseForge (NightBeam convention).
#
# Runs only by hand (workflow_dispatch) or on a v*.*.* tag; a push to main never releases anything.
# Uses exactly the 8 convention jars for the version, in this order of sources:
#   1. releases/fisherman_house-<loader>-<minecraft>-<version>.jar committed to the repo (the jars that went through
#      in-game QA, docs/QA-<version>.md),
#   2. the jars attached to the GitHub Release v<version>,
#   3. a build from source: ./gradlew buildAll (the workspaces must be at <version>).
# The run fails unless all 8 are found: 1.20.1 Fabric + Forge; 1.21.1, 26.2 and 26.3 Fabric + NeoForge. The loader and
# Minecraft version are read from each jar name (.github/scripts/detect-jar-meta.js) and checked against the metadata
# inside the jar.
#
# Same-day guard (NightBeam convention): scripts/same_day_guard.mjs stops the run if this mod already had a
# release today (Africa/Tunis day), on Modrinth, CurseForge or an earlier Publish run. A dry run only reports it.
# It runs before building and again right before the upload, whatever the inputs below say.
#
# Repo secrets: MODRINTH_TOKEN, CURSEFORGE_TOKEN, CURSEFORGE_API_KEY (also lets a rerun skip files already on CurseForge)
# Repo variables: MODRINTH_ID (Dku9hJfB), CURSEFORGE_ID (1388089). Until the variables exist, the old MODRINTH_ID /
# CURSEFORGE_ID secrets are still read, and then these IDs, so the guard and the upload always target this mod.
#
# Prove it first:  gh workflow run publish.yml -f version=2.0.1 -f dry_run=true
# Release:         gh workflow run publish.yml -f version=2.0.1   (or: git tag v2.0.1 && git push origin v2.0.1)
# Re-running is safe: versions that already exist on a platform are skipped (but the same-day guard still applies).

name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without v (default: the version in the workspaces' gradle.properties)"
        required: false
      dry_run:
        description: "Skip uploads if true (check everything, upload nothing)"
        type: choice
        options: ["false", "true"]
        default: "false"
      platforms:
        description: "Where to upload (the same-day guard still applies)"
        type: choice
        options: [both, modrinth, curseforge]
        default: both
      minecraft_version:
        description: "Optional: upload only this Minecraft version's jars (1.20.1, 1.21.1, 26.2 or 26.3); the same-day guard still applies"
        required: false
      update_listing:
        description: "Also update the Modrinth description, summary and icon from marketing/"
        type: choice
        options: ["false", "true"]
        default: "false"

# One Publish at a time per repo, so two runs can't both pass the same-day guard.
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve and check the version
        id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          declared="$(python3 scripts/check_targets.py version)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="$declared"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not a release version: '$version'"; exit 1
          fi
          if [ "$version" != "$declared" ]; then
            echo "::error::Version $version does not match the workspaces' gradle.properties ($declared)"; exit 1
          fi
          if [ ! -f "patchnotes/$version.md" ]; then
            echo "::error::Missing patchnotes/$version.md (the changelog sent to both sites)"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test publisher scripts
        run: |
          node --test scripts/*.test.mjs
          node .github/scripts/detect-jar-meta.test.js

      - name: Same-day guard
        env:
          MODRINTH_ID: ${{ vars.MODRINTH_ID || secrets.MODRINTH_ID || 'Dku9hJfB' }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID || secrets.CURSEFORGE_ID || '1388089' }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_WORKFLOW: publish.yml
          UPLOAD_STEP: Upload Modrinth + CurseForge
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/same_day_guard.mjs

      - name: Find prebuilt release jars
        id: prebuilt
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Only the 8 convention names are ever picked up; anything else in releases/ (older versions, dropped
          # targets such as 26.1.2) is ignored.
          mapfile -t NAMES < <(python3 -c 'import sys; sys.path.insert(0, "scripts"); import check_targets as c; print("\n".join(sorted(c.expected_names(sys.argv[1]))))' "$VERSION")
          found=0
          for name in "${NAMES[@]}"; do
            if [ -f "releases/$name" ]; then
              cp -f "releases/$name" dist/
              found=$((found + 1))
            fi
          done
          if [ "$found" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Using $found prebuilt jar(s) from releases/"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No convention jars for ${VERSION} in releases/; will try the GitHub Release, then build from source"
          fi

      - name: Download GitHub release jars
        id: ghrelease
        if: steps.prebuilt.outputs.found != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          patterns=()
          while IFS= read -r name; do patterns+=(--pattern "$name"); done < <(python3 -c 'import sys; sys.path.insert(0, "scripts"); import check_targets as c; print("\n".join(sorted(c.expected_names(sys.argv[1]))))' "$VERSION")
          if gh release view "v${VERSION}" --repo "$REPO" >/dev/null 2>&1; then
            gh release download "v${VERSION}" --repo "$REPO" --dir dist --clobber "${patterns[@]}" || true
          fi
          count=$(find dist -maxdepth 1 -name 'fisherman_house-*.jar' | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Using $count jar(s) from GitHub Release v${VERSION}"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No GitHub Release jars for v${VERSION}; building from source"
          fi

      # 21 stays JAVA_HOME (Gradle for 1.20.1/1.21.1); 17 is the 1.20.1 toolchain; the root build hands 26.x
      # JAVA_HOME_25_X64.
      - uses: actions/setup-java@v4
        if: steps.prebuilt.outputs.found != 'true' && steps.ghrelease.outputs.found != 'true'
        with:
          distribution: temurin
          java-version: |
            17
            25
            21

      - uses: gradle/actions/setup-gradle@v4
        if: steps.prebuilt.outputs.found != 'true' && steps.ghrelease.outputs.found != 'true'

      - name: Build from source
        if: steps.prebuilt.outputs.found != 'true' && steps.ghrelease.outputs.found != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/check_targets.py workspaces
          chmod +x gradlew 1.20.1/gradlew 1.21.1/gradlew 26.2/gradlew 26.3/gradlew
          ./gradlew buildAll --no-daemon
          python3 scripts/check_targets.py jars --version "$VERSION" --dir releases --list-file built-jars.txt
          mkdir -p dist
          xargs -a built-jars.txt cp -f -t dist/

      - name: Verify release jars
        id: jars
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          MC_FILTER: ${{ inputs.minecraft_version }}
        run: |
          set -euo pipefail
          # Exactly the 8 convention jars, one per loader + Minecraft pair, or the run stops here.
          python3 scripts/check_targets.py jars --version "$VERSION" --dir dist --list-file all-jars.txt
          mapfile -t JARS < all-jars.txt
          for jar in "${JARS[@]}"; do
            name=$(basename "$jar")
            rest=${name#fisherman_house-}; loader=${rest%%-*}; rest=${rest#*-}; mc=${rest%-"$VERSION".jar}
            meta=$(node .github/scripts/detect-jar-meta.js "$jar")
            [ "$meta" = "{\"loader\":\"$loader\",\"gv\":\"$mc\"}" ] || { echo "::error::$jar parsed as $meta"; exit 1; }
            # The jar's own metadata must name the mod and this version.
            case $loader in
              fabric) inner=$(unzip -p "$jar" fabric.mod.json) ;;
              forge) inner=$(unzip -p "$jar" META-INF/mods.toml) ;;
              neoforge) inner=$(unzip -p "$jar" META-INF/neoforge.mods.toml) ;;
            esac
            grep -q 'fisherman_house' <<<"$inner" || { echo "::error::$jar: mod id missing from its metadata"; exit 1; }
            grep -qF "$VERSION" <<<"$inner" || { echo "::error::$jar: version $VERSION missing from its metadata"; exit 1; }
          done
          if [ -n "$MC_FILTER" ]; then
            case "$MC_FILTER" in
              1.20.1|1.21.1|26.2|26.3) ;;
              *) echo "::error::minecraft_version must be 1.20.1, 1.21.1, 26.2 or 26.3, not ${MC_FILTER}"; exit 1 ;;
            esac
            FILTERED=()
            for jar in "${JARS[@]}"; do
              if [[ "$(basename "$jar")" == fisherman_house-*-"${MC_FILTER}"-"${VERSION}".jar ]]; then
                FILTERED+=("$jar")
              fi
            done
            JARS=("${FILTERED[@]}")
            echo "Uploading only Minecraft ${MC_FILTER}:"
          fi
          printf '%s\n' "${JARS[@]}" | tee jar-list.txt

      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: dist/*.jar

      - name: Same-day guard (again, right before upload)
        if: ${{ inputs.dry_run != 'true' }}
        env:
          MODRINTH_ID: ${{ vars.MODRINTH_ID || secrets.MODRINTH_ID || 'Dku9hJfB' }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID || secrets.CURSEFORGE_ID || '1388089' }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_WORKFLOW: publish.yml
          UPLOAD_STEP: Upload Modrinth + CurseForge
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/same_day_guard.mjs

      - name: Upload Modrinth + CurseForge
        if: ${{ inputs.dry_run != 'true' }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID || secrets.MODRINTH_ID || 'Dku9hJfB' }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID || secrets.CURSEFORGE_ID || '1388089' }}
          VERSION: ${{ steps.ver.outputs.version }}
          PLATFORMS: ${{ inputs.platforms || 'both' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MODRINTH_ID:-}" && test -n "${CURSEFORGE_ID:-}"
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { detectRequired, LOADER_IDS } = require('./.github/scripts/detect-jar-meta.js');
          const env = process.env;
          const version = env.VERSION;
          const platforms = env.PLATFORMS;
          const doModrinth = platforms === 'both' || platforms === 'modrinth';
          const doCurse = platforms === 'both' || platforms === 'curseforge';
          const jars = fs.readFileSync('jar-list.txt', 'utf8').split('\n').map((s) => s.trim()).filter(Boolean);
          const changelog = fs.readFileSync(path.join('patchnotes', `${version}.md`), 'utf8');
          for (const [key, needed] of [['MODRINTH_TOKEN', doModrinth], ['MODRINTH_ID', doModrinth],
              ['CURSEFORGE_TOKEN', doCurse], ['CURSEFORGE_ID', doCurse]]) {
            if (needed && !env[key]) throw new Error(`${key} is not set`);
          }

          // fetch with retries on rate limits and server errors.
          async function request(url, options, label) {
            for (let attempt = 1; ; attempt++) {
              const res = await fetch(url, options);
              if (res.ok || attempt >= 4 || !(res.status === 429 || res.status >= 500)) {
                const text = await res.text();
                if (!res.ok) throw new Error(`${label}: ${res.status} ${text.slice(0, 500)}`);
                return text;
              }
              const wait = 5000 * attempt;
              console.warn(`${label}: ${res.status}, retrying in ${wait / 1000}s`);
              await new Promise((r) => setTimeout(r, wait));
            }
          }

          async function modrinth() {
            const headers = { Authorization: env.MODRINTH_TOKEN };
            const existing = JSON.parse(await request(`https://api.modrinth.com/v2/project/${env.MODRINTH_ID}/version`,
              { headers }, 'Modrinth versions')).map((v) => v.version_number);
            for (const jar of jars) {
              const { loader, gv } = detectRequired(jar);
              const number = `${version}+${loader}-${gv}`;
              if (existing.includes(number)) {
                console.log('Modrinth: already there, skipped', number);
                continue;
              }
              const body = {
                name: `${version} ${loader} ${gv}`,
                version_number: number,
                changelog,
                // Fabric jars need Fabric API (Modrinth project P7dR8mSH).
                dependencies: loader === 'fabric' ? [{ project_id: 'P7dR8mSH', dependency_type: 'required' }] : [],
                game_versions: [gv],
                version_type: 'release',
                loaders: [loader],
                featured: false,
                status: 'listed',
                project_id: env.MODRINTH_ID,
                file_parts: ['file_0'],
                primary_file: 'file_0',
              };
              const form = new FormData();
              form.append('data', JSON.stringify(body));
              form.append('file_0', new Blob([fs.readFileSync(jar)]), path.basename(jar));
              await request('https://api.modrinth.com/v2/version', { method: 'POST', headers, body: form }, `Modrinth ${number}`);
              console.log('Modrinth OK', path.basename(jar));
            }
          }

          function flattenVersions(payload) {
            const flat = [];
            const data = payload?.data ?? payload;
            if (!Array.isArray(data)) return flat;
            for (const entry of data) {
              if (Array.isArray(entry?.versions)) flat.push(...entry.versions);
              else if (entry && entry.id != null && entry.name) flat.push(entry);
            }
            return flat;
          }

          function versionId(flat, name) {
            const match = flat.find((v) => v.name === name || v.slug === name)
              ?? flat.find((v) => String(v.name).toLowerCase() === String(name).toLowerCase());
            return match?.id;
          }

          async function curseforge() {
            const flat = flattenVersions(JSON.parse(await request('https://minecraft.curseforge.com/api/game/versions',
              { headers: { 'X-Api-Token': env.CURSEFORGE_TOKEN } }, 'CurseForge game versions')));
            if (!flat.length) throw new Error('No CurseForge game versions resolved');
            // Listing the files already uploaded needs the Core API key; without it every jar is uploaded.
            let existing = [];
            if (env.CURSEFORGE_API_KEY) {
              const files = JSON.parse(await request(`https://api.curseforge.com/v1/mods/${env.CURSEFORGE_ID}/files?pageSize=50`,
                { headers: { 'x-api-key': env.CURSEFORGE_API_KEY } }, 'CurseForge files'));
              existing = (files.data || []).map((f) => f.displayName || f.fileName);
            } else {
              console.log('::warning::CURSEFORGE_API_KEY is not set: files already on CurseForge are not detected and would be uploaded again');
            }
            for (const jar of jars) {
              const name = path.basename(jar);
              if (existing.includes(name)) {
                console.log('CurseForge: already there, skipped', name);
                continue;
              }
              const { loader, gv } = detectRequired(jar);
              const ids = [versionId(flat, gv), LOADER_IDS[loader], versionId(flat, 'Client'), versionId(flat, 'Server')];
              if (ids[0] == null) throw new Error(`No CurseForge game version for ${gv}`);
              const meta = {
                changelog,
                changelogType: 'markdown',
                displayName: name,
                gameVersions: ids.filter((id) => id != null),
                releaseType: 'release',
              };
              if (loader === 'fabric') meta.relations = { projects: [{ slug: 'fabric-api', type: 'requiredDependency' }] };
              const form = new FormData();
              form.append('metadata', JSON.stringify(meta));
              form.append('file', new Blob([fs.readFileSync(jar)]), name);
              await request(`https://minecraft.curseforge.com/api/projects/${env.CURSEFORGE_ID}/upload-file`,
                { method: 'POST', headers: { 'X-Api-Token': env.CURSEFORGE_TOKEN }, body: form }, `CurseForge ${name}`);
              console.log('CurseForge OK', name);
            }
          }

          (async () => {
            if (doModrinth) await modrinth();
            if (doCurse) await curseforge();
          })().catch((e) => { console.error(e.message || e); process.exit(1); });
          NODE

      # CurseForge has no API for the project description: paste marketing/curseforge/description.md there by hand.
      - name: Update the Modrinth listing
        if: ${{ inputs.update_listing == 'true' && inputs.dry_run != 'true' }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID || secrets.MODRINTH_ID || 'Dku9hJfB' }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          (async () => {
            const headers = { Authorization: process.env.MODRINTH_TOKEN };
            const project = `https://api.modrinth.com/v2/project/${process.env.MODRINTH_ID}`;
            const body = fs.readFileSync('marketing/modrinth/description.md', 'utf8');
            const description = fs.readFileSync('marketing/modrinth/summary.txt', 'utf8').trim();
            const res = await fetch(project, {
              method: 'PATCH',
              headers: { ...headers, 'Content-Type': 'application/json' },
              body: JSON.stringify({ body, description }),
            });
            if (!res.ok) throw new Error('Modrinth listing ' + res.status + ' ' + (await res.text()).slice(0, 300));
            const icon = await fetch(`${project}/icon?ext=png`, {
              method: 'PATCH',
              headers: { ...headers, 'Content-Type': 'image/png' },
              body: fs.readFileSync('marketing/images/icon.png'),
            });
            if (!icon.ok) throw new Error('Modrinth icon ' + icon.status + ' ' + (await icon.text()).slice(0, 300));
            console.log('Modrinth description, summary and icon updated');
          })().catch((e) => { console.error(e); process.exit(1); });
          NODE
